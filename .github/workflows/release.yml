name: Release plugin

# Creeaza automat un GitHub Release + ZIP curat cand versiunea din header-ul
# pluginului creste. Site-ul (prin Plugin Update Checker) vede release-ul si
# ofera update in WordPress.

on:
  push:
    branches:
      - main
    paths:
      - 'sc-programari.php'
      - 'includes/**'
      - 'assets/**'
      - 'templates/**'
      - 'lib/**'
      - 'uninstall.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none

      - name: Verificari inainte de release (sintaxa, versiune, fisiere)
        run: |
          set -e
          # 1. Sintaxa PHP in tot pluginul (fara dev/ si tools/, care nu intra in ZIP)
          find . -name '*.php' -not -path './dev/*' -not -path './tools/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
          # 2. Versiunea din header = SCP_VERSION
          H=$(grep -iE '^\s*\*\s*Version:' sc-programari.php | head -1 | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          C=$(grep -oE "define\( 'SCP_VERSION', '[^']+'" sc-programari.php | sed -E "s/.*'([^']+)'$/\1/")
          if [ "$H" != "$C" ]; then echo "Version din header ($H) difera de SCP_VERSION ($C)" >&2; exit 1; fi
          # 3. Fiecare fisier din assets/ incarcat in cod exista in repo
          for f in $(grep -rhoE "assets/[A-Za-z0-9_./-]+\.(css|js|woff2)" includes sc-programari.php | sort -u); do
            if [ ! -f "$f" ]; then echo "Lipseste $f (e incarcat in cod, dar nu e in repo)" >&2; exit 1; fi
          done
          echo "Verificari OK"

      - name: Citeste versiunea din header
        id: version
        run: |
          VERSION=$(grep -iE '^\s*\*\s*Version:' sc-programari.php | head -1 | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "Nu am gasit versiunea in header." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versiune detectata: $VERSION"

      - name: Verifica daca release-ul exista deja
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} exista deja, se sare peste."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construieste ZIP-ul pluginului
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p build/sc-programari
          rsync -a ./ build/sc-programari/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dev' \
            --exclude 'tools' \
            --exclude 'CLAUDE.md' \
            --exclude '.gitignore' \
            --exclude 'build' \
            --exclude '*.zip'
          cd build
          zip -rq sc-programari.zip sc-programari
          ls -la

      - name: Creeaza release-ul cu asset
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            build/sc-programari.zip \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Versiune ${{ steps.version.outputs.version }} a pluginului SC Programări Crăciun." \
            --target "${{ github.sha }}"
